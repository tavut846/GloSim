services:
  # Strapi Headless CMS Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: glosim-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: ${DATABASE_CLIENT:-sqlite}
      DATABASE_FILENAME: ${DATABASE_FILENAME:-.tmp/data.db}
      # To connect to host-installed PostgreSQL, set DATABASE_CLIENT=postgres in .env
      DATABASE_HOST: ${DATABASE_HOST:-host.docker.internal}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-glosim_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-glosim_admin}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-glosim_secret_pwd}
      DATABASE_SSL: ${DATABASE_SSL:-false}
    volumes:
      - strapi_uploads:/opt/app/public/uploads
      - ./backend/.tmp:/opt/app/.tmp
    ports:
      - "${BACKEND_PORT:-1337}:1337"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - glosim-network

  # Web Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: glosim-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - glosim-network

volumes:
  strapi_uploads:

networks:
  glosim-network:
    driver: bridge
