<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="./_ds/glosim-d2271487-a9b5-4f2b-9d18-ac11ca4f8f1d/styles.css"/>
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
  <script src="./image-slot.js"></script>
  <style>
    body{margin:0;background:var(--limestone);}
    a{color:var(--symposium-blue);}
    a:hover{color:var(--symposium-blue-hover);}
  </style>
</helmet>

<div style="min-height:100vh;padding:40px 0;display:flex;justify-content:center;font-family:var(--font-sans);">
<div style="width:{{pageWidth}}px;max-width:{{pageWidth}}px;background:var(--white);box-shadow:{{frameShadow}};border-radius:{{frameRadius}};overflow:hidden;position:relative;">

<header style="position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:{{navPad}};border-bottom:1px solid var(--border-default);background:var(--white);font-family:{{fontFamily}};">
  <a href="Homepage.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
    <div style="width:36px;height:36px;border-radius:var(--radius-sm);background:var(--symposium-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;">IF</div>
    <span style="font-weight:var(--weight-bold);font-size:16px;color:var(--ink-900);white-space:nowrap;">{{c.orgShort}}</span>
  </a>
  <nav style="display:{{navRowDisplay}};gap:28px;align-items:center;">
    <sc-for list="{{c.navItems}}" as="item" hint-placeholder-count="5">
      <a href="{{item.href}}" style="font-size:var(--text-body-md);color:var(--ink-900);text-decoration:none;font-weight:var(--weight-medium);">{{item.label}}</a>
    </sc-for>
  </nav>
  <div style="display:{{navRowDisplay}};align-items:center;gap:12px;">
    <div style="display:flex;gap:2px;background:var(--limestone);border-radius:var(--radius-pill);padding:3px;">
      <button onClick="{{setLangEn}}" style="{{langEnStyle}}">EN</button>
      <button onClick="{{setLangZh}}" style="{{langZhStyle}}">中文</button>
    </div>
  </div>
  <button style="display:{{hamburgerDisplay}};background:none;border:none;cursor:pointer;padding:4px;" onClick="{{toggleMobileMenu}}">
    <i data-lucide="{{hamburgerIconName}}" style="width:24px;height:24px;color:var(--ink-900);"></i>
  </button>
</header>

<sc-if value="{{mobileMenuOpenAndMobile}}" hint-placeholder-val="{{false}}">
  <div style="position:absolute;top:60px;left:0;right:0;background:#fff;border-bottom:1px solid var(--border-default);z-index:49;padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-raised);">
    <sc-for list="{{c.navItems}}" as="item" hint-placeholder-count="5">
      <a href="{{item.href}}" style="font-size:15px;color:var(--ink-900);text-decoration:none;font-weight:500;">{{item.label}}</a>
    </sc-for>
    <div style="display:flex;gap:2px;background:var(--limestone);border-radius:999px;padding:3px;width:fit-content;margin-top:4px;">
      <button onClick="{{setLangEn}}" style="{{langEnStyle}}">EN</button>
      <button onClick="{{setLangZh}}" style="{{langZhStyle}}">中文</button>
    </div>
  </div>
</sc-if>

<section style="padding:{{heroPadV}} {{sectionPadH}} {{sectionPadV}};background:var(--limestone);font-family:{{fontFamily}};">
  <div style="max-width:1100px;margin:0 auto;">
    <span style="font-size:var(--text-label-caps);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--symposium-blue);font-weight:600;">{{c.pageEyebrow}}</span>
    <h1 style="font-size:{{h1Size}};font-weight:var(--weight-extrabold);line-height:var(--leading-tight);color:var(--ink-900);margin:12px 0 12px;">{{c.pageTitle}}</h1>
    <p style="font-size:var(--text-body-lg);color:var(--slate-600);line-height:var(--leading-body);margin:0;max-width:640px;">{{c.pageSubtitle}}</p>
  </div>
</section>

<section style="padding:{{sectionPadV}} {{sectionPadH}} {{sectionPadVEnd}};background:var(--white);font-family:{{fontFamily}};">
  <div style="max-width:1100px;margin:0 auto;display:grid;grid-template-columns:{{gridCols}};gap:24px;">
    <sc-for list="{{c.pastConfs}}" as="pc" hint-placeholder-count="8">
      <div style="border:1px solid var(--border-default);border-radius:var(--radius-md);overflow:hidden;background:#fff;box-shadow:var(--shadow-card);">
        <image-slot id="{{pc.imgId}}" shape="rect" placeholder="Conference photo" style="width:100%;height:160px;"></image-slot>
        <div style="padding:16px 18px;">
          <span style="font-size:13px;color:var(--symposium-blue);font-weight:700;">{{pc.year}} · {{pc.city}}</span>
          <p style="margin:6px 0 8px;font-size:16px;font-weight:600;color:var(--ink-900);">{{pc.title}}</p>
          <a href="#" style="font-size:13px;color:var(--symposium-blue);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:4px;">{{c.proceedingsLabel}}<i data-lucide="arrow-right" style="width:14px;height:14px;"></i></a>
        </div>
      </div>
    </sc-for>
  </div>
</section>

<footer style="background:var(--ink-900);color:var(--slate-400);padding:56px {{sectionPadH}} 28px;font-family:{{fontFamily}};">
  <div style="max-width:1100px;margin:0 auto;display:flex;flex-direction:{{footerFlexDir}};justify-content:space-between;gap:32px;">
    <div style="max-width:360px;">
      <div style="color:#fff;font-weight:700;font-size:16px;margin-bottom:12px;">{{c.orgFull}}</div>
      <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;font-size:14px;">
        <i data-lucide="map-pin" style="width:16px;height:16px;flex-shrink:0;margin-top:2px;"></i>
        <span>{{c.footerAddress}}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;">
        <i data-lucide="mail" style="width:16px;height:16px;flex-shrink:0;"></i>
        <span>{{c.footerEmail}}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;font-size:14px;">
        <i data-lucide="phone" style="width:16px;height:16px;flex-shrink:0;"></i>
        <span>{{c.footerPhone}}</span>
      </div>
    </div>
    <div style="display:flex;gap:12px;align-items:flex-start;">
      <a href="#" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--slate-600);display:flex;align-items:center;justify-content:center;color:var(--slate-400);"><i data-lucide="linkedin" style="width:16px;height:16px;"></i></a>
      <a href="#" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--slate-600);display:flex;align-items:center;justify-content:center;color:var(--slate-400);"><i data-lucide="twitter" style="width:16px;height:16px;"></i></a>
      <a href="#" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--slate-600);display:flex;align-items:center;justify-content:center;color:var(--slate-400);"><i data-lucide="youtube" style="width:16px;height:16px;"></i></a>
    </div>
  </div>
  <div style="max-width:1100px;margin:32px auto 0;border-top:1px solid rgba(255,255,255,0.12);padding-top:18px;font-size:13px;color:var(--slate-600);">{{c.copyright}}</div>
</footer>

</div>
</div>

<div style="position:fixed;bottom:20px;right:20px;display:flex;gap:2px;background:var(--ink-900);border-radius:var(--radius-pill);padding:3px;box-shadow:var(--shadow-raised);z-index:100;">
  <button onClick="{{setDesktop}}" style="{{viewportDesktopStyle}}">Desktop</button>
  <button onClick="{{setMobile}}" style="{{viewportMobileStyle}}">Mobile</button>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const CONTENT = {
  en: {
    orgShort: 'IFSS', orgFull: 'International Federation for Simulation Science',
    navItems: [
      {label:'Home', href:'Homepage.dc.html'},{label:'Organization', href:'Organization.dc.html'},
      {label:'Conference Schedule', href:'ConferenceSchedule.dc.html'},{label:'Call for Papers', href:'CallForPapers.dc.html'},
      {label:'Past Conferences', href:'PastConferences.dc.html'}
    ],
    pageEyebrow: 'Past Conferences', pageTitle: 'Past Conferences',
    pageSubtitle: 'A record of past World Congresses on Simulation Science, held biennially since 1994.',
    proceedingsLabel: 'View proceedings',
    pastConfs: [
      {imgId:'past-1', year:'2025', city:'Berlin, Germany', title:'24th World Congress on Simulation Science'},
      {imgId:'past-2', year:'2023', city:'Seoul, South Korea', title:'23rd World Congress on Simulation Science'},
      {imgId:'past-3', year:'2021', city:'Vancouver, Canada (Virtual)', title:'22nd World Congress on Simulation Science'},
      {imgId:'past-4', year:'2019', city:'Kyoto, Japan', title:'21st World Congress on Simulation Science'},
      {imgId:'past-5', year:'2017', city:'Cape Town, South Africa', title:'20th World Congress on Simulation Science'},
      {imgId:'past-6', year:'2015', city:'São Paulo, Brazil', title:'19th World Congress on Simulation Science'},
      {imgId:'past-7', year:'2013', city:'Vienna, Austria', title:'18th World Congress on Simulation Science'},
      {imgId:'past-8', year:'2011', city:'Boston, USA', title:'17th World Congress on Simulation Science'}
    ],
    footerAddress: 'Federation Secretariat · 12 Rue de Genève · 1201 Geneva · Switzerland',
    footerEmail: 'info@ifss.org', footerPhone: '+41 22 555 0134',
    copyright: '© 2027 International Federation for Simulation Science'
  },
  zh: {
    orgShort: 'IFSS', orgFull: '国际仿真科学联合会',
    navItems: [
      {label:'首页', href:'Homepage.dc.html'},{label:'组织机构', href:'Organization.dc.html'},
      {label:'会议日程', href:'ConferenceSchedule.dc.html'},{label:'征稿启事', href:'CallForPapers.dc.html'},
      {label:'历届会议', href:'PastConferences.dc.html'}
    ],
    pageEyebrow: '历届会议', pageTitle: '历届会议',
    pageSubtitle: '自1994年起两年一届举办的仿真科学世界大会历届记录。',
    proceedingsLabel: '查看论文集',
    pastConfs: [
      {imgId:'past-1', year:'2025', city:'德国柏林', title:'第24届仿真科学世界大会'},
      {imgId:'past-2', year:'2023', city:'韩国首尔', title:'第23届仿真科学世界大会'},
      {imgId:'past-3', year:'2021', city:'加拿大温哥华（线上）', title:'第22届仿真科学世界大会'},
      {imgId:'past-4', year:'2019', city:'日本京都', title:'第21届仿真科学世界大会'},
      {imgId:'past-5', year:'2017', city:'南非开普敦', title:'第20届仿真科学世界大会'},
      {imgId:'past-6', year:'2015', city:'巴西圣保罗', title:'第19届仿真科学世界大会'},
      {imgId:'past-7', year:'2013', city:'奥地利维也纳', title:'第18届仿真科学世界大会'},
      {imgId:'past-8', year:'2011', city:'美国波士顿', title:'第17届仿真科学世界大会'}
    ],
    footerAddress: '联合会秘书处 · 日内瓦Rue de Genève 12号 · 1201 · 瑞士',
    footerEmail: 'info@ifss.org', footerPhone: '+41 22 555 0134',
    copyright: '© 2027 国际仿真科学联合会'
  }
};

class Component extends DCLogic {
  state = { lang: 'en', viewport: 'desktop', mobileMenuOpen: false };

  componentDidMount() { this._icons(); }
  componentDidUpdate() { this._icons(); }
  _icons() { if (window.lucide) window.lucide.createIcons(); }

  renderVals() {
    const lang = this.state.lang;
    const isMobile = this.state.viewport === 'mobile';
    const c = CONTENT[lang];

    const pillBtn = (active) => ({
      background: active ? '#fff' : 'transparent', color: active ? 'var(--symposium-blue)' : 'var(--ink-700)',
      border: 'none', borderRadius: 'var(--radius-pill)', padding: '6px 14px', fontSize: '13px', fontWeight: 600, cursor: 'pointer'
    });
    const viewportBtn = (active) => ({
      background: active ? 'var(--symposium-blue)' : 'transparent', color: '#fff', border: 'none',
      borderRadius: 'var(--radius-pill)', padding: '7px 14px', fontSize: '12px', fontWeight: 600, cursor: 'pointer'
    });

    return {
      c, lang, isMobile,
      pageWidth: isMobile ? 390 : 1440,
      frameShadow: isMobile ? 'var(--shadow-raised)' : 'none',
      frameRadius: isMobile ? 'var(--radius-lg)' : '0',
      fontFamily: lang === 'zh' ? '"PingFang SC","Source Han Sans SC","Microsoft YaHei",var(--font-sans)' : 'var(--font-sans)',
      navPad: isMobile ? '14px 16px' : '18px 48px',
      sectionPadH: isMobile ? '20px' : '64px',
      sectionPadV: isMobile ? '40px' : '80px',
      sectionPadVEnd: isMobile ? '40px' : '80px',
      heroPadV: isMobile ? '32px' : '64px',
      h1Size: isMobile ? '2rem' : 'var(--text-h1)',
      gridCols: isMobile ? 'repeat(1,1fr)' : 'repeat(4,1fr)',
      footerFlexDir: isMobile ? 'column' : 'row',
      navRowDisplay: isMobile ? 'none' : 'flex',
      hamburgerDisplay: isMobile ? 'flex' : 'none',
      hamburgerIconName: this.state.mobileMenuOpen ? 'x' : 'menu',
      mobileMenuOpenAndMobile: isMobile && this.state.mobileMenuOpen,
      langEnStyle: pillBtn(lang === 'en'),
      langZhStyle: pillBtn(lang === 'zh'),
      viewportDesktopStyle: viewportBtn(!isMobile),
      viewportMobileStyle: viewportBtn(isMobile),
      setLangEn: () => this.setState({ lang: 'en' }),
      setLangZh: () => this.setState({ lang: 'zh' }),
      toggleMobileMenu: () => this.setState(s => ({ mobileMenuOpen: !s.mobileMenuOpen })),
      setDesktop: () => this.setState({ viewport: 'desktop', mobileMenuOpen: false }),
      setMobile: () => this.setState({ viewport: 'mobile' })
    };
  }
}

</script>
</body>
</html>
