name: Build & Package Deployment Artifact

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build Prebuilt Artifacts & Docker Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 1. Resolve Version, Compute Pre-Release Tag, and Generate Release Notes
      - name: Resolve Version & Generate Release Notes
        id: versioning
        run: |
          git fetch --tags --force || true
          node scripts/resolve-version.js

      # 2. Install & Build Frontend
      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      - name: Build Frontend Artifact
        run: npm run build --prefix frontend
        env:
          VITE_STRAPI_URL: ${{ vars.VITE_STRAPI_URL || 'http://localhost:1337' }}

      # 3. Install & Build Backend (Strapi)
      - name: Install Backend Dependencies
        run: npm install --legacy-peer-deps --prefix backend

      - name: Build Backend Admin Panel
        run: npm run build --prefix backend
        env:
          NODE_ENV: production

      # 4. Clean up backend devDependencies for production runtime
      - name: Prune Backend DevDependencies
        run: npm prune --production --legacy-peer-deps --prefix backend

      # 5. Assemble Deployment Bundle (All Docker files in root folder)
      - name: Prepare Deployment Artifact Directory
        run: |
          mkdir -p bundle/frontend/dist
          mkdir -p bundle/backend/.tmp

          # Copy prebuilt frontend assets
          cp -r frontend/dist/* bundle/frontend/dist/

          # Copy prebuilt backend application & production node_modules
          cp -r backend/node_modules bundle/backend/
          cp -r backend/build bundle/backend/ || true
          cp -r backend/dist bundle/backend/ || true
          cp -r backend/config bundle/backend/
          cp -r backend/src bundle/backend/
          cp -r backend/public bundle/backend/
          cp -r backend/database bundle/backend/ || true
          cp backend/package.json bundle/backend/
          cp backend/server.js bundle/backend/

          # Copy Docker deployment files from docker/ directly into bundle root
          cp docker/* bundle/
          chmod +x bundle/glosim-deploy.sh || true

          # Copy env template, release notes, and default deploy .env (with SQLite default storage)
          cp .env.example bundle/.env.example
          cp .env.example bundle/.env
          cp README.md bundle/
          cp RELEASE_NOTES.md bundle/ || true

      # 6. Upload GitHub Actions Artifact (Folder uploaded directly as 'glosim' - downloads as glosim.zip without zip-in-zip)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glosim
          path: bundle/
          retention-days: 30

      # 7. Package Zip Archive for Pre-Release Asset (Preserve symlinks with -y)
      - name: Package Zip for Pre-Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          cd bundle
          zip -ry ../glosim.zip .
          cd ..

      # 8. Upload Artifact to GitHub Pre-Release with Auto-Version & Release Notes
      - name: Publish Pre-Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: ${{ steps.versioning.outputs.release_title }}
          prerelease: ${{ steps.versioning.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.versioning.outputs.is_prerelease != 'true' }}
          files: glosim.zip
          body_path: ${{ steps.versioning.outputs.notes_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

