name: Build & Package Deployment Artifact

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build Prebuilt Artifacts & Docker Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # 1. Resolve Version, Compute Pre-Release Tag, and Generate Release Notes
      - name: Resolve Version & Generate Release Notes
        id: versioning
        run: |
          git fetch --tags --force || true
          node scripts/resolve-version.js

      # 2. Install & Build Frontend
      - name: Install & Build Frontend
        run: |
          npm ci --prefer-offline --prefix frontend
          npm run build --prefix frontend
        env:
          VITE_STRAPI_URL: ${{ vars.VITE_STRAPI_URL || 'http://localhost:1337' }}

      # 3. Install & Build Backend (Strapi)
      - name: Install & Build Backend Admin Panel
        run: |
          npm ci --legacy-peer-deps --prefer-offline --prefix backend || npm install --legacy-peer-deps --prefer-offline --prefix backend
          npm run build --prefix backend
        env:
          NODE_ENV: production

      # 4. Clean up backend devDependencies for production runtime & include ARM64 binaries
      - name: Prune Backend DevDependencies & Include Multi-Arch Binaries
        run: |
          npm prune --production --legacy-peer-deps --prefix backend
          # Pre-install ARM64 platform binaries into node_modules so artifact runs seamlessly on ARM64 & x64 hosts
          npm install --prefix backend --os=linux --cpu=arm64 --libc=glibc --no-save @img/sharp-linux-arm64@0.33.5 @img/sharp-libvips-linux-arm64@1.0.4 || true

      # 5. Assemble Deployment Bundle (Move prebuilt assets instantly with mv)
      - name: Prepare Deployment Artifact Directory
        run: |
          mkdir -p bundle/backend/.tmp

          # Move prebuilt frontend assets (instant inode move)
          mkdir -p bundle/frontend
          mv frontend/dist bundle/frontend/dist

          # Move production node_modules & prebuilt backend files (instant inode move instead of slow cp -r)
          mv backend/node_modules bundle/backend/
          cp -r backend/build bundle/backend/ || true
          cp -r backend/dist bundle/backend/ || true
          cp -r backend/config bundle/backend/
          cp -r backend/src bundle/backend/
          cp -r backend/public bundle/backend/
          cp -r backend/database bundle/backend/ || true
          cp backend/package.json bundle/backend/
          cp backend/server.js bundle/backend/

          # Ensure strapi CLI wrapper in .bin is self-contained even if symlinks are dereferenced
          mkdir -p bundle/backend/node_modules/.bin
          printf '#!/usr/bin/env node\nrequire("../@strapi/strapi/bin/strapi.js");\n' > bundle/backend/node_modules/.bin/strapi
          chmod +x bundle/backend/node_modules/.bin/strapi

          # Copy Docker deployment files from docker/ directly into bundle root (excluding standalone glosim-deploy.sh)
          cp docker/docker-compose.yml bundle/
          cp docker/Dockerfile.backend bundle/
          cp docker/Dockerfile.frontend bundle/
          cp docker/nginx.conf bundle/

          # Copy env template, release notes, and default deploy .env (with SQLite default storage)
          cp .env.example bundle/.env.example
          cp .env.example bundle/.env
          cp README.md bundle/
          cp RELEASE_NOTES.md bundle/ || true

      # 6. Package Zip Archive First (Preserve symlinks with -y)
      - name: Package Zip for Deployment & Pre-Release
        run: |
          cd bundle
          zip -ry ../glosim.zip .
          cd ..

      # 7. Upload GitHub Actions Artifact (Fast single zip upload in <10s instead of 10+ mins)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glosim
          path: glosim.zip
          retention-days: 30

      # 8. Upload Artifact to GitHub Pre-Release with Auto-Version & Release Notes
      - name: Publish Pre-Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: ${{ steps.versioning.outputs.release_title }}
          prerelease: ${{ steps.versioning.outputs.is_prerelease == 'true' }}
          make_latest: ${{ steps.versioning.outputs.is_prerelease != 'true' }}
          files: glosim.zip
          body_path: ${{ steps.versioning.outputs.notes_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

